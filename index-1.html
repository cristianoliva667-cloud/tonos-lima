<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tonos Lima</title>
<meta name="description" content="Encuentra las fiestas de tu zona en Lima">
<meta name="theme-color" content="#0b1b34">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1b34'/%3E%3Ctext x='16' y='23' font-size='20' font-family='Arial' font-weight='700' text-anchor='middle' fill='white'%3ET%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#0f172a;--mut:#64748b;--ac:#1d4ed8;--bd:#e2e8f0;--on:#fff;--hd:#0b1b34;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0a0f1a;--card:#121a2a;--tx:#e8edf5;--mut:#8a97ab;--ac:#5b9bff;--bd:#202c42;--on:#08101f;--hd:#070c16;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;background:var(--hd);color:#fff;position:sticky;top:0;z-index:5}
.brand{font-weight:700;font-size:19px;letter-spacing:-.01em}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:#c3cce0}.who .lnk{color:#fff}
.av{width:30px;height:30px;border-radius:50%;object-fit:cover;background:var(--bd);display:inline-flex;align-items:center;justify-content:center;font-weight:600;color:var(--tx)}
.big{width:72px;height:72px;font-size:26px}
.mut{color:var(--mut)}.sm{font-size:13px}
h1{margin:4px 0;font-size:24px;font-weight:600;letter-spacing:-.01em}h3{margin:6px 0 2px;font-size:17px;font-weight:600}
label{display:block;font-size:14px;margin:10px 0 0;color:var(--mut)}
input,textarea,select{width:100%;padding:11px 12px;margin-top:4px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--tx)}
textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:10px}.row>*{flex:1}
.btn{display:block;width:100%;margin-top:14px;padding:12px;border:1px solid var(--ac);border-radius:8px;background:var(--ac);color:var(--on);font-family:inherit;font-weight:500;font-size:15px;cursor:pointer}
.btn:disabled{opacity:.5}
.lnk{background:none;border:0;color:var(--ac);font:inherit;font-size:13px;cursor:pointer;padding:0 4px;text-decoration:underline}
.login{max-width:420px;margin:56px auto 0;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:24px}
.tabs{display:flex;gap:8px;margin:14px 0 8px}
.tabs button{flex:1;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
.tabs button.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0}
.chip{white-space:nowrap;padding:6px 12px;border-radius:6px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.hero{background:linear-gradient(135deg,var(--hd),#16315f);color:#fff;border-radius:14px;padding:22px 18px}
.hero h2{margin:0 0 10px;font-size:22px;font-weight:600}
.hero input{margin:0;border:0}.hero input:focus{box-shadow:0 0 0 2px var(--ac)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0 10px}.sec h3{margin:0;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.poster{position:relative;height:130px;padding:14px;color:#fff;display:flex;align-items:flex-end;justify-content:space-between}
.poster .tag{position:absolute;top:10px;right:10px;float:none;border-color:transparent;background:rgba(0,0,0,.4);color:#fff}
.dt{background:rgba(255,255,255,.15);border-radius:10px;padding:6px 12px;text-align:center;line-height:1.1}
.dt b{display:block;font-size:26px}.dt span{font-size:12px;letter-spacing:.1em}
.pz{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.9}
.body{padding:14px 16px 8px;flex:1}.body h3{margin:0 0 4px}.body p{margin:2px 0}
.pr{font-weight:700;font-size:18px;margin-top:8px!important}
.card .foot{margin:0;padding:10px 16px}
.nav2{margin:4px 0;border-bottom:1px solid var(--bd);gap:0}
.nav2 button{flex:none;background:none;border:0;border-bottom:2px solid transparent;border-radius:0;padding:10px 14px;color:var(--mut)}
.nav2 button.on{background:none;color:var(--tx);border-color:var(--ac)}
.zone{font-size:12px;font-weight:500;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.tag{float:right;font-size:12px;padding:1px 8px;border-radius:6px;border:1px solid var(--bd);color:var(--mut)}
.when{font-weight:500}.when::first-letter{text-transform:uppercase}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;border-top:1px solid var(--bd);padding-top:8px}
.empty{text-align:center;padding:30px 10px;color:var(--mut)}
.err{color:#d33;font-size:14px;margin-top:10px}.ok{color:#2a8a4a;font-size:14px;margin-top:10px}
.card,.chip,.tabs button,.btn,input,textarea,select{transition:border-color .2s,background .2s,color .2s,transform .2s,opacity .2s}
.card:hover{border-color:var(--mut);transform:translateY(-2px)}
.btn:hover{opacity:.85}.btn:active{transform:scale(.98)}
.chip:hover,.tabs button:hover{border-color:var(--mut)}
.card.in{animation:up .45s ease backwards}
.login,.wrap{animation:fade .4s ease backwards}
#main>*{animation:fade .3s ease backwards}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.card{cursor:pointer}
.poster{height:170px;overflow:hidden}
.poster::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.6),rgba(0,0,0,0) 65%)}
.poster>*{position:relative;z-index:1}
.poster>.fl{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.poster>.tag{position:absolute}
.fav{position:absolute!important;top:8px;left:8px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.4);color:#fff;font-size:18px;line-height:1;cursor:pointer}
.fav.on{color:#ff7a90}
.cat{font-size:12px;font-weight:600;color:var(--ac)}
.hero .row{margin-top:10px}.hero select{margin:0;border:0}
.detail{display:grid;gap:22px}
@media(min-width:760px){.detail{grid-template-columns:360px 1fr}}
.dp{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:4/5;color:#fff;display:flex;align-items:center;justify-content:center}
.dp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.facts{display:grid;grid-template-columns:90px 1fr;gap:8px 12px;margin:14px 0}.facts dt{color:var(--mut)}.facts dd{margin:0}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 8px}
.btns a,.btns button{flex:1 1 170px;text-align:center;text-decoration:none;padding:12px;border-radius:8px;border:1px solid var(--ac);background:var(--ac);color:var(--on);font:inherit;font-weight:500;cursor:pointer}
.btns .o{background:none;color:var(--tx);border-color:var(--bd)}
.mrow{margin-bottom:12px}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const sb=supabase.createClient('https://eebtfjbrsbwplyrqckga.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVlYnRmamJyc2J3cGx5cnFja2dhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyMzkzMjYsImV4cCI6MjEwODgxNTMyNn0.lyg5wsFyiYQkWGN1VN2cf2uhj1l4FrFwyhaQEG5_AMQ');
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me=null,parties=[],zone='Todas',q='',tab='feed',mode='login',ready=false,favs=new Set(),fd='Todas',fc='Todos',onlyFav=false,openId=null,editId=null,mine=[],recov=false,showRep=false;
const CATS=['Reggaetón','Cumbia y salsa','Electrónica','Rock y pop','Otro'];
const today=()=>new Date().toLocaleDateString('en-CA');
function fmt(d,t){const x=new Date(d+'T'+(t?t.slice(0,5):'00:00'));if(isNaN(x))return d||'';return x.toLocaleDateString('es-PE',{weekday:'long',day:'numeric',month:'long'})+(t?' · '+t.slice(0,5):'')}
const msg=(t,ok)=>{const e=$('#msg');if(e){e.className=ok?'ok':'err';e.textContent=t}};
function avatar(u,big){return u&&u.avatar_url?`<img class="av ${big?'big':''}" src="${esc(u.avatar_url)}" alt="">`:`<span class="av ${big?'big':''}">${esc((u&&u.username||'?')[0].toUpperCase())}</span>`}
function resize(file){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const s=256,c=document.createElement('canvas');c.width=c.height=s;const m=Math.min(i.width,i.height);c.getContext('2d').drawImage(i,(i.width-m)/2,(i.height-m)/2,m,m,0,0,s,s);c.toBlob(b=>b?ok(b):no(),'image/jpeg',.85)};i.onerror=no;i.src=URL.createObjectURL(file)})}
async function setAvatar(file,uid){
 const b=await resize(file),path=uid+'/avatar.jpg';
 const u=await sb.storage.from('avatars').upload(path,b,{upsert:true,contentType:'image/jpeg'});if(u.error)throw u.error;
 const url=sb.storage.from('avatars').getPublicUrl(path).data.publicUrl+'?v='+Date.now();
 const r=await sb.from('profiles').update({avatar_url:url}).eq('id',uid);if(r.error)throw r.error;
 if(me)me.avatar_url=url;
}
async function loadFavs(){const r=await sb.from('favorites').select('party_id');favs=new Set((r.data||[]).map(x=>x.party_id))}
async function loadMine(){const r=await sb.from('parties').select('*').eq('organizer_id',me.id).order('party_date',{ascending:false});mine=r.data||[]}
async function loadMe(id){const r=await sb.from('profiles').select('*').eq('id',id).single();return r.data||null}
async function loadParties(){const r=await sb.from('parties').select('*').gte('party_date',today()).order('party_date').order('party_time',{nullsFirst:false});parties=r.data||[]}

sb.auth.onAuthStateChange((ev,s)=>{
 if(ev==='PASSWORD_RECOVERY')recov=true;
 if(ev==='TOKEN_REFRESHED'||ev==='USER_UPDATED')return;
 setTimeout(async()=>{
  if(s&&me&&me.id===s.user.id)return;
  me=s?await loadMe(s.user.id):null;
  if(me){await loadParties();await loadFavs();if(me.role==='organizer')await loadMine()}
  ready=true;render();
 },0);
});

function render(){
 const a=$('#app');
 if(!ready){a.innerHTML='<div class="empty">Cargando…</div>';return}
 if(recov){a.innerHTML=`<div class="wrap login"><h1>Nueva contraseña</h1><label>Escribe tu nueva contraseña (mínimo 8 caracteres)<input id="s_pass" type="password" autocomplete="new-password"></label><div id="msg"></div><button class="btn" id="go" onclick="setNewPass()">Guardar contraseña</button></div>`;return}
 if(!me){
  const su=mode==='signup';
  a.innerHTML=`<div class="wrap login"><h1>Tonos Lima</h1><p class="mut">Encuentra y publica las fiestas de tu zona.</p>
  <div class="tabs"><button class="${su?'':'on'}" onclick="mode='login';render()">Iniciar sesión</button><button class="${su?'on':''}" onclick="mode='signup';render()">Crear cuenta</button></div>
  ${su?`<label>Tipo de cuenta<select id="s_role"><option value="user">Usuario: busco fiestas</option><option value="organizer">Organizador: publico fiestas</option></select></label>
  <label>Nombre de usuario<input id="s_user" maxlength="30" autocomplete="username"></label>`:''}
  <label>Correo electrónico<input id="s_mail" type="email" autocomplete="email"></label>
  <label>Contraseña${su?' (mínimo 8 caracteres)':''}<input id="s_pass" type="password" autocomplete="${su?'new-password':'current-password'}"></label>
  ${su?`<label>Número de teléfono<input id="s_tel" type="tel" placeholder="+51 999 999 999" autocomplete="tel"></label>
  <label>Foto de perfil (opcional)<input id="s_pic" type="file" accept="image/*"></label>`:''}
  <div id="msg"></div>
  <button class="btn" id="go" onclick="${su?'signup()':'login()'}">${su?'Crear cuenta':'Entrar'}</button>${su?'':'<p class="sm" style="text-align:center"><button class="lnk" onclick="resetPass()">¿Olvidaste tu contraseña?</button></p>'}
  ${su?'<p class="mut sm">Tu correo y teléfono no se muestran a otras personas.</p>':''}</div>`;
  return;
 }
 const org=me.role==='organizer';
 a.innerHTML=`<header><span class="brand">Tonos Lima</span><span class="who">${avatar(me)}<span>${esc(me.username)}</span><button class="lnk" onclick="logout()">Salir</button></span></header>
 <div class="wrap"><div class="tabs nav2"><button id="t_feed" onclick="setTab('feed')">Fiestas</button>${org?'<button id="t_mine" onclick="setTab(\'mine\')">Mis fiestas</button><button id="t_add" onclick="setTab(\'add\')">+ Agregar</button>':''}<button id="t_me" onclick="setTab('me')">Mi perfil</button></div><div id="main"></div></div>`;
 openId=location.hash.startsWith('#fiesta-')?location.hash.slice(8):null;
 main();
}
const fit=(file,max)=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):no(),'image/jpeg',.82)};i.onerror=no;i.src=URL.createObjectURL(file)});
const safeUrl=u=>u&&u.startsWith('https://eebtfjbrsbwplyrqckga.supabase.co/storage/')?u:'';
const wa=n=>{let d=String(n).replace(/\D/g,'');if(d.length===9)d='51'+d;return 'https://wa.me/'+d};
const G=['#0b1b34,#1f4a8a','#14213d,#3a4f7a','#1b1f3b,#4a3f8f','#0f2a33,#1f6f78','#241b2f,#6b3f6e'];
const grad=p=>G[[...p.name].reduce((x,c)=>x+c.charCodeAt(0),0)%G.length];
const price=p=>p.price==null?'Entrada libre':'S/ '+p.price;
const opts=(a,cur)=>a.map(([v,l])=>`<option value="${esc(v)}" ${v===cur?'selected':''}>${esc(l)}</option>`).join('');
const shareUrl=p=>'https://wa.me/?text='+encodeURIComponent(`${p.name} · ${fmt(p.party_date,p.party_time)} · ${p.place} (${p.zone})`);
function setTab(t){tab=t;openId=null;editId=null;showRep=false;if(location.hash)history.replaceState(null,'',location.pathname);main()}
function openParty(id){location.hash='fiesta-'+id}
addEventListener('hashchange',()=>{openId=location.hash.startsWith('#fiesta-')?location.hash.slice(8):null;if(me&&$('#main')){main();scrollTo(0,0)}});
function zones(){return [...new Set(parties.map(p=>p.zone))].sort()}
function main(){
 const org=me.role==='organizer',cur=openId?'feed':tab;
 ['feed','mine','add','me'].forEach(t=>{const b=$('#t_'+t);if(b)b.className=cur===t?'on':''});
 const m=$('#main');
 if(openId){detail();return}
 if(tab==='mine'&&org){minePage()}else if(tab==='add'&&org){formParty()}else if(tab==='me'){
  m.innerHTML=`<div style="display:flex;align-items:center;gap:14px;margin-top:8px">${avatar(me,true)}<div><h3>${esc(me.username)}</h3><span class="mut sm">${me.role==='organizer'?'Organizador':'Usuario'}</span></div></div>
  <label>Número de teléfono<input id="p_tel" type="tel" value="${esc(me.phone)}"></label>
  <label>Cambiar foto de perfil<input id="p_pic" type="file" accept="image/*"></label>
  <div id="msg"></div><button class="btn" id="go" onclick="saveProfile()">Guardar cambios</button>`;
 }else{
  m.innerHTML=`<div class="hero"><h2>Las fiestas de tu zona</h2><input id="q" placeholder="Buscar fiesta, lugar o zona…" oninput="q=this.value;list()" value="${esc(q)}">
  <div class="row"><select onchange="fd=this.value;list(true)">${opts([['Todas','Cualquier fecha'],['Hoy','Hoy'],['Semana','Próximos 7 días']],fd)}</select><select onchange="fc=this.value;list(true)">${opts([['Todos','Todos los géneros'],...CATS.map(c=>[c,c])],fc)}</select></div></div>
  <div id="chips" class="chips"></div><div class="sec"><h3>Próximas fiestas</h3><span class="mut sm" id="cnt"></span></div><div id="list"></div>`;
  list(true);
 }
}
function detail(){
 const p=parties.find(x=>x.id===openId)||mine.find(x=>x.id===openId),m=$('#main');
 if(!p){m.innerHTML='<div class="empty">Esta fiesta ya no está disponible.<br><button class="lnk" onclick="setTab(\'feed\')">Volver a las fiestas</button></div>';return}
 const u=safeUrl(p.flyer_url),f=favs.has(p.id),map='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.place+', '+p.zone+', Lima');
 m.innerHTML=`<p><button class="lnk" onclick="setTab('feed')">← Volver a las fiestas</button></p><div class="detail">
 <div class="dp" style="background:linear-gradient(135deg,${grad(p)})">${u?`<img src="${esc(u)}" alt="Flyer de ${esc(p.name)}">`:`<b style="font-size:72px">${new Date(p.party_date+'T00:00:00').getDate()}</b>`}</div>
 <div><span class="zone">${esc(p.zone)}</span>${p.category?` · <span class="cat">${esc(p.category)}</span>`:''}${p.adult?' <span class="tag" style="float:none">+18</span>':''}
 <h1>${esc(p.name)}</h1>
 <dl class="facts"><dt>Fecha</dt><dd>${esc(fmt(p.party_date,null))}</dd>${p.party_time?`<dt>Hora</dt><dd>${esc(p.party_time.slice(0,5))}</dd>`:''}<dt>Lugar</dt><dd>${esc(p.place)}</dd><dt>Entrada</dt><dd><b>${esc(price(p))}</b></dd><dt>Organiza</dt><dd>${esc(p.organizer_name)}</dd></dl>
 ${p.description?`<p style="white-space:pre-line">${esc(p.description)}</p>`:''}
 <div class="btns"><a href="${esc(map)}" target="_blank" rel="noopener">Cómo llegar</a><button class="o" onclick="fav(openId)">${f?'♥ Guardada':'♡ Guardar'}</button><a class="o" href="${esc(shareUrl(p))}" target="_blank" rel="noopener">Compartir</a><button class="o" onclick="ics(openId)">Agregar al calendario</button>${p.contact_phone?`<a class="o" href="${esc(wa(p.contact_phone))}" target="_blank" rel="noopener">Contactar al organizador</a>`:''}</div>
 <p>${p.organizer_id===me.id?'<button class="lnk" onclick="editParty(openId)">Editar</button><button class="lnk" onclick="del(openId)">Eliminar esta fiesta</button>':'<button class="lnk" onclick="showRep=!showRep;detail()">Reportar esta fiesta</button>'}</p>${showRep&&p.organizer_id!==me.id?`<div class="row"><select id="rp"><option>Posible estafa</option><option>Información falsa</option><option>Contenido inapropiado</option><option>Otro motivo</option></select><button class="lnk" onclick="report(openId)">Enviar reporte</button></div><div id="msg"></div>`:''}</div></div>`;
}
function list(a){
 if(!$('#list'))return;
 const zs=['Todas',...zones()];if(!zs.includes(zone))zone='Todas';
 $('#chips').innerHTML=zs.map(z=>`<button class="chip ${z===zone?'on':''}" data-z="${esc(z)}" onclick="zone=this.dataset.z;list(true)">${esc(z)}</button>`).join('')+`<button class="chip ${onlyFav?'on':''}" onclick="onlyFav=!onlyFav;list(true)">♥ Guardadas</button>`;
 const k=q.toLowerCase(),t=today(),wk=new Date(Date.now()+6*864e5).toLocaleDateString('en-CA');
 const r=parties.filter(p=>(zone==='Todas'||p.zone===zone)&&(fd==='Todas'||(fd==='Hoy'?p.party_date===t:p.party_date<=wk))&&(fc==='Todos'||p.category===fc)&&(!onlyFav||favs.has(p.id))&&(!k||[p.name,p.place,p.zone,p.description,p.category].join(' ').toLowerCase().includes(k)));
 $('#cnt').textContent=r.length+(r.length===1?' fiesta':' fiestas');
 if(!r.length){$('#list').innerHTML=`<div class="empty">No hay fiestas para mostrar${me.role==='organizer'?'. ¡Agrega la primera!':' por ahora.'}</div>`;return}
 $('#list').innerHTML='<div class="grid">'+r.map((p,i)=>{
  const d=new Date(p.party_date+'T00:00:00'),u=safeUrl(p.flyer_url),f=favs.has(p.id);
  return `<article class="card ${a?'in':''}" data-id="${esc(p.id)}" onclick="openParty(this.dataset.id)" style="animation-delay:${Math.min(i,8)*60}ms"><div class="poster" style="background:linear-gradient(135deg,${grad(p)})">${u?`<img class="fl" src="${esc(u)}" alt="" loading="lazy">`:''}<button class="fav ${f?'on':''}" data-id="${esc(p.id)}" onclick="event.stopPropagation();fav(this.dataset.id)" aria-label="Guardar">${f?'♥':'♡'}</button>${p.adult?'<span class="tag">+18</span>':''}<span class="pz">${esc(p.zone)}${p.category?' · '+esc(p.category):''}</span><div class="dt"><b>${d.getDate()}</b><span>${esc(d.toLocaleDateString('es-PE',{month:'short'}).replace('.','').toUpperCase())}</span></div></div>
  <div class="body"><h3>${esc(p.name)}</h3><p class="when">${esc(fmt(p.party_date,p.party_time))}</p><p class="mut">${esc(p.place)}</p><p class="pr">${esc(price(p))}</p></div>
  <div class="foot"><span class="mut sm">Organiza: ${esc(p.organizer_name)}</span><span><a class="lnk" target="_blank" rel="noopener" href="${esc(shareUrl(p))}" onclick="event.stopPropagation()">Compartir</a></span></div></article>`}).join('')+'</div>';
}
async function fav(id){
 const on=favs.has(id);on?favs.delete(id):favs.add(id);openId?detail():list();
 const r=on?await sb.from('favorites').delete().eq('party_id',id):await sb.from('favorites').insert({party_id:id});
 if(r.error){on?favs.add(id):favs.delete(id);openId?detail():list()}
}
function errTxt(e){const m=(e&&e.message||'').toLowerCase();
 if(m.includes('invalid login'))return 'Correo o contraseña incorrectos.';
 if(m.includes('not confirmed'))return 'Primero confirma tu correo con el enlace que te enviamos.';
 if(m.includes('rate limit'))return 'Demasiados intentos. Espera unos minutos.';
 if(m.includes('password'))return 'La contraseña debe tener al menos 8 caracteres.';
 return 'Ocurrió un error. Intenta de nuevo.'}
async function login(){
 const mail=$('#s_mail').value.trim(),pass=$('#s_pass').value;
 if(!mail||!pass)return msg('Ingresa tu correo y contraseña.');
 $('#go').disabled=true;
 const r=await sb.auth.signInWithPassword({email:mail,password:pass});
 if(r.error){msg(errTxt(r.error));$('#go').disabled=false}
}
async function signup(){
 const role=$('#s_role').value,user=$('#s_user').value.trim(),mail=$('#s_mail').value.trim(),pass=$('#s_pass').value,tel=$('#s_tel').value.trim(),pic=$('#s_pic').files[0];
 if(user.length<3)return msg('El nombre de usuario debe tener al menos 3 caracteres.');
 if(!mail)return msg('Ingresa tu correo electrónico.');
 if(pass.length<8)return msg('La contraseña debe tener al menos 8 caracteres.');
 if(!/^\+?[0-9 ]{7,16}$/.test(tel))return msg('Ingresa un número de teléfono válido.');
 $('#go').disabled=true;
 const av=await sb.rpc('username_available',{u:user});
 if(av.data===false){$('#go').disabled=false;return msg('Ese nombre de usuario ya está en uso.')}
 const r=await sb.auth.signUp({email:mail,password:pass,options:{emailRedirectTo:back(),data:{username:user,phone:tel,role}}});
 if(r.error){$('#go').disabled=false;return msg(errTxt(r.error))}
 if(r.data.user&&r.data.user.identities&&!r.data.user.identities.length){$('#go').disabled=false;return msg('Ese correo ya está registrado.')}
 if(r.data.session){if(pic){try{await setAvatar(pic,r.data.user.id)}catch(e){}}return}
 mode='login';render();msg('Cuenta creada. Revisa tu correo, confirma tu cuenta y luego inicia sesión. Podrás agregar tu foto desde Mi perfil.',true);
}
async function logout(){await sb.auth.signOut()}
const back=()=>location.protocol.startsWith('http')?location.origin+location.pathname:undefined;
function formParty(){
 const p=editId?(parties.find(x=>x.id===editId)||mine.find(x=>x.id===editId)):null,v=k=>p&&p[k]!=null?esc(p[k]):'';
 $('#main').innerHTML=`<h3>${p?'Editar fiesta':'Nueva fiesta'}</h3>
 <label>Nombre de la fiesta<input id="f_name" maxlength="80" value="${v('name')}"></label>
 <label>Zona o barrio<input id="f_zone" maxlength="40" list="zl" value="${v('zone')}" placeholder="Ej. Barrio Centro"><datalist id="zl">${zones().map(z=>`<option value="${esc(z)}">`).join('')}</datalist></label>
 <div class="row"><label>Fecha<input id="f_date" type="date" ${p?'':`min="${today()}"`} value="${v('party_date')}"></label><label>Hora<input id="f_time" type="time" value="${p&&p.party_time?esc(p.party_time.slice(0,5)):''}"></label></div>
 <label>Lugar o dirección<input id="f_place" maxlength="100" value="${v('place')}"></label>
 <div class="row"><label>Entrada en soles (vacío = libre)<input id="f_price" type="number" min="0" step="0.5" inputmode="decimal" value="${v('price')}"></label><label>Género musical<select id="f_cat"><option value="">Sin especificar</option>${CATS.map(c=>`<option ${p&&p.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select></label></div>
 <label>${p&&p.flyer_url?'Cambiar flyer (opcional)':'Flyer o foto de la fiesta (opcional)'}<input id="f_pic" type="file" accept="image/*"></label>
 <label>Descripción<textarea id="f_desc" maxlength="400">${v('description')}</textarea></label>
 <label>WhatsApp de contacto (opcional, lo verán quienes abran la fiesta)<input id="f_contact" type="tel" value="${v('contact_phone')}" placeholder="+51 999 999 999"></label>
 <label><input id="f_adult" type="checkbox" style="width:auto;margin-right:8px" ${p&&p.adult?'checked':''}>Solo mayores de 18 años</label>
 <div id="msg"></div><button class="btn" id="go" onclick="addParty()">${p?'Guardar cambios':'Publicar fiesta'}</button>${p?'<button class="btn" style="background:none;color:var(--tx);border-color:var(--bd)" onclick="setTab(\'mine\')">Cancelar</button>':''}`;
}
function minePage(){
 const t=today();
 $('#main').innerHTML=`<div class="sec"><h3>Mis fiestas</h3><span class="mut sm">${mine.length} en total</span></div>`+(mine.length?mine.map(p=>`<div class="card mrow" style="cursor:default"><div class="body"><h3>${esc(p.name)} ${p.party_date<t?'<span class="tag" style="float:none">Pasada</span>':''}</h3><p class="when">${esc(fmt(p.party_date,p.party_time))}</p><p class="mut">${esc(p.zone)} · ${esc(p.place)}</p></div><div class="foot"><span></span><span><button class="lnk" data-id="${esc(p.id)}" onclick="openParty(this.dataset.id)">Ver</button><button class="lnk" data-id="${esc(p.id)}" onclick="editParty(this.dataset.id)">Editar</button><button class="lnk" data-id="${esc(p.id)}" onclick="del(this.dataset.id)">Eliminar</button></span></div></div>`).join(''):'<div class="empty">Todavía no publicaste fiestas.</div>');
}
function editParty(id){editId=id;tab='add';openId=null;if(location.hash)history.replaceState(null,'',location.pathname);main();scrollTo(0,0)}
async function report(id){
 const r=await sb.from('reports').insert({party_id:id,reason:$('#rp').value});
 msg(r.error?(r.error.code==='23505'?'Ya reportaste esta fiesta.':'No se pudo enviar el reporte.'):'Gracias, revisaremos esta fiesta.',!r.error);
}
function ics(id){
 const p=parties.find(x=>x.id===id)||mine.find(x=>x.id===id);if(!p)return;
 const e=t=>String(t||'').replace(/[\\;,]/g,'\\$&').replace(/\n/g,'\\n'),z=n=>String(n).padStart(2,'0'),d=p.party_date.replace(/-/g,'');
 let st='DTSTART;VALUE=DATE:'+d,en='';
 if(p.party_time){const h=p.party_time.slice(0,5),x=new Date(p.party_date+'T'+h);x.setHours(x.getHours()+4);st='DTSTART:'+d+'T'+h.replace(':','')+'00';en='DTEND:'+x.getFullYear()+z(x.getMonth()+1)+z(x.getDate())+'T'+z(x.getHours())+z(x.getMinutes())+'00'}
 const body=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Tonos Lima//ES','BEGIN:VEVENT','UID:'+p.id+'@tonoslima',st,en,'SUMMARY:'+e(p.name),'LOCATION:'+e(p.place+', '+p.zone),'DESCRIPTION:'+e(p.description),'END:VEVENT','END:VCALENDAR'].filter(Boolean).join('\r\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([body],{type:'text/calendar'}));a.download='fiesta.ics';a.click();
}
async function resetPass(){
 const mail=$('#s_mail').value.trim();if(!mail)return msg('Escribe tu correo arriba y vuelve a tocar el enlace.');
 const r=await sb.auth.resetPasswordForEmail(mail,{redirectTo:back()});
 msg(r.error?errTxt(r.error):'Te enviamos un enlace a tu correo para crear una nueva contraseña.',!r.error);
}
async function setNewPass(){
 const pw=$('#s_pass').value;if(pw.length<8)return msg('La contraseña debe tener al menos 8 caracteres.');
 $('#go').disabled=true;const r=await sb.auth.updateUser({password:pw});
 if(r.error){$('#go').disabled=false;return msg(errTxt(r.error))}
 recov=false;render();
}
const rmFlyer=u=>{const f=u&&u.split('/flyers/')[1];if(f)sb.storage.from('flyers').remove([decodeURIComponent(f.split('?')[0])])};
async function addParty(){
 const v=id=>$('#'+id).value.trim(),pr=v('f_price'),file=$('#f_pic').files[0],ct=v('f_contact');
 const d={name:v('f_name'),zone:v('f_zone'),party_date:v('f_date'),party_time:v('f_time')||null,place:v('f_place'),price:pr===''?null:Number(pr),description:v('f_desc')||null,adult:$('#f_adult').checked,category:v('f_cat')||null,contact_phone:ct||null};
 if(!d.name||!d.zone||!d.party_date||!d.place)return msg('Completa nombre, zona, fecha y lugar.');
 if(ct&&!/^\+?[0-9 ]{7,16}$/.test(ct))return msg('El WhatsApp de contacto no es válido.');
 $('#go').disabled=true;
 try{
  const old=editId?(parties.find(x=>x.id===editId)||mine.find(x=>x.id===editId)):null;
  if(file){const b=await fit(file,1200),path=me.id+'/'+Date.now()+'.jpg';const u=await sb.storage.from('flyers').upload(path,b,{contentType:'image/jpeg'});if(u.error)throw u.error;d.flyer_url=sb.storage.from('flyers').getPublicUrl(path).data.publicUrl}
  const r=editId?await sb.from('parties').update(d).eq('id',editId):await sb.from('parties').insert(d);
  if(r.error)throw r.error;
  if(file&&old)rmFlyer(old.flyer_url);
  const was=editId;editId=null;await loadParties();await loadMine();zone='Todas';tab=was?'mine':'feed';render();
 }catch(e){$('#go').disabled=false;msg(e&&e.message&&e.message.includes('Límite')?'Llegaste al límite de fiestas por día. Intenta mañana.':'No se pudo guardar. Revisa los datos e intenta de nuevo.')}
}
async function del(id){
 if(!confirm('¿Eliminar esta fiesta?'))return;
 const p=parties.find(x=>x.id===id)||mine.find(x=>x.id===id);
 const r=await sb.from('parties').delete().eq('id',id);if(r.error)return;
 if(p)rmFlyer(p.flyer_url);
 parties=parties.filter(x=>x.id!==id);mine=mine.filter(x=>x.id!==id);
 if(openId)setTab('feed');else if(tab==='mine')minePage();else list();
}
async function saveProfile(){
 const tel=$('#p_tel').value.trim(),pic=$('#p_pic').files[0];
 if(!/^\+?[0-9 ]{7,16}$/.test(tel))return msg('Ingresa un número de teléfono válido.');
 $('#go').disabled=true;
 try{
  const r=await sb.from('profiles').update({phone:tel}).eq('id',me.id);if(r.error)throw r.error;me.phone=tel;
  if(pic)await setAvatar(pic,me.id);
  render();tab='me';main();msg('Cambios guardados.',true);
 }catch(e){$('#go').disabled=false;msg('No se pudo guardar. Intenta de nuevo.')}
}
render();
</script>
</body>
</html>
