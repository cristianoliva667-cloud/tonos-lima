<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tonos Lima</title>
<style>
:root{--bg:#fff;--card:#fff;--tx:#111;--mut:#737373;--ac:#111;--bd:#e5e5e5;--on:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0e0e0e;--card:#0e0e0e;--tx:#f5f5f5;--mut:#9a9a9a;--ac:#f5f5f5;--bd:#2a2a2a;--on:#0e0e0e;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--bd)}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.av{width:30px;height:30px;border-radius:50%;object-fit:cover;background:var(--bd);display:inline-flex;align-items:center;justify-content:center;font-weight:600;color:var(--tx)}
.big{width:72px;height:72px;font-size:26px}
.mut{color:var(--mut)}.sm{font-size:13px}
h1{margin:4px 0;font-size:24px;font-weight:600;letter-spacing:-.01em}h3{margin:6px 0 2px;font-size:17px;font-weight:600}
label{display:block;font-size:14px;margin:10px 0 0;color:var(--mut)}
input,textarea,select{width:100%;padding:11px 12px;margin-top:4px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--tx)}
textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:10px}.row>*{flex:1}
.btn{display:block;width:100%;margin-top:14px;padding:12px;border:1px solid var(--ac);border-radius:8px;background:var(--ac);color:var(--on);font-family:inherit;font-weight:500;font-size:15px;cursor:pointer}
.btn:disabled{opacity:.5}
.lnk{background:none;border:0;color:var(--ac);font:inherit;font-size:13px;cursor:pointer;padding:0 4px;text-decoration:underline}
.login{padding-top:56px}
.tabs{display:flex;gap:8px;margin:14px 0 8px}
.tabs button{flex:1;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
.tabs button.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0}
.chip{white-space:nowrap;padding:6px 12px;border-radius:6px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.card{border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:12px}
.card p{margin:3px 0}
.zone{font-size:12px;font-weight:500;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.tag{float:right;font-size:12px;padding:1px 8px;border-radius:6px;border:1px solid var(--bd);color:var(--mut)}
.when{font-weight:500}.when::first-letter{text-transform:uppercase}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;border-top:1px solid var(--bd);padding-top:8px}
.empty{text-align:center;padding:30px 10px;color:var(--mut)}
.err{color:#d33;font-size:14px;margin-top:10px}.ok{color:#2a8a4a;font-size:14px;margin-top:10px}
.card,.chip,.tabs button,.btn,input,textarea,select{transition:border-color .2s,background .2s,color .2s,transform .2s,opacity .2s}
.card:hover{border-color:var(--mut);transform:translateY(-2px)}
.btn:hover{opacity:.85}.btn:active{transform:scale(.98)}
.chip:hover,.tabs button:hover{border-color:var(--mut)}
.card.in{animation:up .45s ease backwards}
.login,.wrap{animation:fade .4s ease backwards}
#main>*{animation:fade .3s ease backwards}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const sb=supabase.createClient('https://eebtfjbrsbwplyrqckga.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVlYnRmamJyc2J3cGx5cnFja2dhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyMzkzMjYsImV4cCI6MjEwODgxNTMyNn0.lyg5wsFyiYQkWGN1VN2cf2uhj1l4FrFwyhaQEG5_AMQ');
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me=null,parties=[],zone='Todas',q='',tab='feed',mode='login',ready=false;
const today=()=>new Date().toLocaleDateString('en-CA');
function fmt(d,t){const x=new Date(d+'T'+(t?t.slice(0,5):'00:00'));if(isNaN(x))return d||'';return x.toLocaleDateString('es-PE',{weekday:'long',day:'numeric',month:'long'})+(t?' · '+t.slice(0,5):'')}
const msg=(t,ok)=>{const e=$('#msg');if(e){e.className=ok?'ok':'err';e.textContent=t}};
function avatar(u,big){return u&&u.avatar_url?`<img class="av ${big?'big':''}" src="${esc(u.avatar_url)}" alt="">`:`<span class="av ${big?'big':''}">${esc((u&&u.username||'?')[0].toUpperCase())}</span>`}
function resize(file){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const s=256,c=document.createElement('canvas');c.width=c.height=s;const m=Math.min(i.width,i.height);c.getContext('2d').drawImage(i,(i.width-m)/2,(i.height-m)/2,m,m,0,0,s,s);c.toBlob(b=>b?ok(b):no(),'image/jpeg',.85)};i.onerror=no;i.src=URL.createObjectURL(file)})}
async function setAvatar(file,uid){
 const b=await resize(file),path=uid+'/avatar.jpg';
 const u=await sb.storage.from('avatars').upload(path,b,{upsert:true,contentType:'image/jpeg'});if(u.error)throw u.error;
 const url=sb.storage.from('avatars').getPublicUrl(path).data.publicUrl+'?v='+Date.now();
 const r=await sb.from('profiles').update({avatar_url:url}).eq('id',uid);if(r.error)throw r.error;
 if(me)me.avatar_url=url;
}
async function loadMe(id){const r=await sb.from('profiles').select('*').eq('id',id).single();return r.data||null}
async function loadParties(){const r=await sb.from('parties').select('*').gte('party_date',today()).order('party_date').order('party_time',{nullsFirst:false});parties=r.data||[]}

sb.auth.onAuthStateChange((ev,s)=>{
 if(ev==='TOKEN_REFRESHED'||ev==='USER_UPDATED')return;
 setTimeout(async()=>{
  if(s&&me&&me.id===s.user.id)return;
  me=s?await loadMe(s.user.id):null;
  if(me)await loadParties();
  ready=true;render();
 },0);
});

function render(){
 const a=$('#app');
 if(!ready){a.innerHTML='<div class="empty">Cargando…</div>';return}
 if(!me){
  const su=mode==='signup';
  a.innerHTML=`<div class="wrap login"><h1>Tonos Lima</h1><p class="mut">Encuentra y publica las fiestas de tu zona.</p>
  <div class="tabs"><button class="${su?'':'on'}" onclick="mode='login';render()">Iniciar sesión</button><button class="${su?'on':''}" onclick="mode='signup';render()">Crear cuenta</button></div>
  ${su?`<label>Tipo de cuenta<select id="s_role"><option value="user">Usuario: busco fiestas</option><option value="organizer">Organizador: publico fiestas</option></select></label>
  <label>Nombre de usuario<input id="s_user" maxlength="30" autocomplete="username"></label>`:''}
  <label>Correo electrónico<input id="s_mail" type="email" autocomplete="email"></label>
  <label>Contraseña${su?' (mínimo 8 caracteres)':''}<input id="s_pass" type="password" autocomplete="${su?'new-password':'current-password'}"></label>
  ${su?`<label>Número de teléfono<input id="s_tel" type="tel" placeholder="+51 999 999 999" autocomplete="tel"></label>
  <label>Foto de perfil (opcional)<input id="s_pic" type="file" accept="image/*"></label>`:''}
  <div id="msg"></div>
  <button class="btn" id="go" onclick="${su?'signup()':'login()'}">${su?'Crear cuenta':'Entrar'}</button>
  ${su?'<p class="mut sm">Tu correo y teléfono no se muestran a otras personas.</p>':''}</div>`;
  return;
 }
 const org=me.role==='organizer';
 a.innerHTML=`<header><b style="font-weight:600">Tonos Lima</b><span class="who">${avatar(me)}<span>${esc(me.username)}</span><button class="lnk" onclick="logout()">Salir</button></span></header>
 <div class="wrap"><div class="tabs"><button id="t_feed" onclick="setTab('feed')">Fiestas</button>${org?'<button id="t_add" onclick="setTab(\'add\')">+ Agregar</button>':''}<button id="t_me" onclick="setTab('me')">Mi perfil</button></div><div id="main"></div></div>`;
 main();
}
function setTab(t){tab=t;main()}
function zones(){return [...new Set(parties.map(p=>p.zone))].sort()}
function main(){
 ['feed','add','me'].forEach(t=>{const b=$('#t_'+t);if(b)b.className=tab===t?'on':''});
 const m=$('#main');
 if(tab==='add'){
  m.innerHTML=`<h3>Nueva fiesta</h3>
  <label>Nombre de la fiesta<input id="f_name" maxlength="80"></label>
  <label>Zona o barrio<input id="f_zone" maxlength="40" list="zl" placeholder="Ej. Barrio Centro"><datalist id="zl">${zones().map(z=>`<option value="${esc(z)}">`).join('')}</datalist></label>
  <div class="row"><label>Fecha<input id="f_date" type="date" min="${today()}"></label><label>Hora<input id="f_time" type="time"></label></div>
  <label>Lugar o dirección<input id="f_place" maxlength="100"></label>
  <label>Entrada en soles (vacío = libre)<input id="f_price" type="number" min="0" step="0.5" inputmode="decimal"></label>
  <label>Descripción<textarea id="f_desc" maxlength="400"></textarea></label>
  <label><input id="f_adult" type="checkbox" style="width:auto;margin-right:8px">Solo mayores de 18 años</label>
  <div id="msg"></div><button class="btn" id="go" onclick="addParty()">Publicar fiesta</button>`;
 }else if(tab==='me'){
  m.innerHTML=`<div style="display:flex;align-items:center;gap:14px;margin-top:8px">${avatar(me,true)}<div><h3>${esc(me.username)}</h3><span class="mut sm">${me.role==='organizer'?'Organizador':'Usuario'}</span></div></div>
  <label>Número de teléfono<input id="p_tel" type="tel" value="${esc(me.phone)}"></label>
  <label>Cambiar foto de perfil<input id="p_pic" type="file" accept="image/*"></label>
  <div id="msg"></div><button class="btn" id="go" onclick="saveProfile()">Guardar cambios</button>`;
 }else{
  m.innerHTML=`<input id="q" placeholder="Buscar fiesta, lugar o zona…" oninput="q=this.value;list()" value="${esc(q)}"><div id="chips" class="chips"></div><div id="list"></div>`;
  list(true);
 }
}
function list(a){
 const zs=['Todas',...zones()];if(!zs.includes(zone))zone='Todas';
 $('#chips').innerHTML=zs.map(z=>`<button class="chip ${z===zone?'on':''}" data-z="${esc(z)}" onclick="zone=this.dataset.z;list(true)">${esc(z)}</button>`).join('');
 const k=q.toLowerCase();
 const r=parties.filter(p=>(zone==='Todas'||p.zone===zone)&&(!k||[p.name,p.place,p.zone,p.description].join(' ').toLowerCase().includes(k)));
 if(!r.length){$('#list').innerHTML=`<div class="empty">No hay fiestas para mostrar${me.role==='organizer'?'. ¡Agrega la primera!':' por ahora.'}</div>`;return}
 $('#list').innerHTML=r.map((p,i)=>{
  const share='https://wa.me/?text='+encodeURIComponent(`${p.name} · ${fmt(p.party_date,p.party_time)} · ${p.place} (${p.zone})`);
  return `<article class="card ${a?'in':''}" style="animation-delay:${Math.min(i,8)*60}ms">${p.adult?'<span class="tag">+18</span>':''}<span class="zone">${esc(p.zone)}</span>
  <h3>${esc(p.name)}</h3><p class="when">${esc(fmt(p.party_date,p.party_time))}</p><p>${esc(p.place)}</p>
  <p style="font-weight:500">${p.price==null?'Entrada libre':'Entrada: S/ '+esc(p.price)}</p>
  ${p.description?`<p class="mut">${esc(p.description)}</p>`:''}
  <div class="foot"><span class="mut sm">Organiza: ${esc(p.organizer_name)}</span><span><a class="lnk" target="_blank" rel="noopener" href="${share}">Compartir</a>${p.organizer_id===me.id?`<button class="lnk" data-id="${esc(p.id)}" onclick="del(this.dataset.id)">Eliminar</button>`:''}</span></div></article>`}).join('');
}
function errTxt(e){const m=(e&&e.message||'').toLowerCase();
 if(m.includes('invalid login'))return 'Correo o contraseña incorrectos.';
 if(m.includes('not confirmed'))return 'Primero confirma tu correo con el enlace que te enviamos.';
 if(m.includes('rate limit'))return 'Demasiados intentos. Espera unos minutos.';
 if(m.includes('password'))return 'La contraseña debe tener al menos 8 caracteres.';
 return 'Ocurrió un error. Intenta de nuevo.'}
async function login(){
 const mail=$('#s_mail').value.trim(),pass=$('#s_pass').value;
 if(!mail||!pass)return msg('Ingresa tu correo y contraseña.');
 $('#go').disabled=true;
 const r=await sb.auth.signInWithPassword({email:mail,password:pass});
 if(r.error){msg(errTxt(r.error));$('#go').disabled=false}
}
async function signup(){
 const role=$('#s_role').value,user=$('#s_user').value.trim(),mail=$('#s_mail').value.trim(),pass=$('#s_pass').value,tel=$('#s_tel').value.trim(),pic=$('#s_pic').files[0];
 if(user.length<3)return msg('El nombre de usuario debe tener al menos 3 caracteres.');
 if(!mail)return msg('Ingresa tu correo electrónico.');
 if(pass.length<8)return msg('La contraseña debe tener al menos 8 caracteres.');
 if(!/^\+?[0-9 ]{7,16}$/.test(tel))return msg('Ingresa un número de teléfono válido.');
 $('#go').disabled=true;
 const av=await sb.rpc('username_available',{u:user});
 if(av.data===false){$('#go').disabled=false;return msg('Ese nombre de usuario ya está en uso.')}
 const r=await sb.auth.signUp({email:mail,password:pass,options:{data:{username:user,phone:tel,role}}});
 if(r.error){$('#go').disabled=false;return msg(errTxt(r.error))}
 if(r.data.user&&r.data.user.identities&&!r.data.user.identities.length){$('#go').disabled=false;return msg('Ese correo ya está registrado.')}
 if(r.data.session){if(pic){try{await setAvatar(pic,r.data.user.id)}catch(e){}}return}
 mode='login';render();msg('Cuenta creada. Revisa tu correo, confirma tu cuenta y luego inicia sesión. Podrás agregar tu foto desde Mi perfil.',true);
}
async function logout(){await sb.auth.signOut()}
async function addParty(){
 const v=id=>$('#'+id).value.trim(),pr=v('f_price');
 const d={name:v('f_name'),zone:v('f_zone'),party_date:v('f_date'),party_time:v('f_time')||null,place:v('f_place'),price:pr===''?null:Number(pr),description:v('f_desc')||null,adult:$('#f_adult').checked};
 if(!d.name||!d.zone||!d.party_date||!d.place)return msg('Completa nombre, zona, fecha y lugar.');
 $('#go').disabled=true;
 const r=await sb.from('parties').insert(d);
 if(r.error){$('#go').disabled=false;return msg('No se pudo publicar. Revisa los datos e intenta de nuevo.')}
 await loadParties();zone='Todas';tab='feed';render();
}
async function del(id){
 if(!confirm('¿Eliminar esta fiesta?'))return;
 const r=await sb.from('parties').delete().eq('id',id);
 if(!r.error){parties=parties.filter(p=>p.id!==id);list()}
}
async function saveProfile(){
 const tel=$('#p_tel').value.trim(),pic=$('#p_pic').files[0];
 if(!/^\+?[0-9 ]{7,16}$/.test(tel))return msg('Ingresa un número de teléfono válido.');
 $('#go').disabled=true;
 try{
  const r=await sb.from('profiles').update({phone:tel}).eq('id',me.id);if(r.error)throw r.error;me.phone=tel;
  if(pic)await setAvatar(pic,me.id);
  render();tab='me';main();msg('Cambios guardados.',true);
 }catch(e){$('#go').disabled=false;msg('No se pudo guardar. Intenta de nuevo.')}
}
render();
</script>
</body>
</html>
